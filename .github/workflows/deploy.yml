name: Deploy React App to GCS

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Install gsutil
        run: |
          sudo apt-get update && sudo apt-get install -y google-cloud-sdk

      - name: Sync build to GCS bucket
        run: |
          gsutil -m rsync -r build gs://agentic-day-frontend

      - name: Make files public
        run: |
          gsutil iam ch allUsers:objectViewer gs://agentic-day-frontend

      # Optional: Invalidate CDN cache so users get latest changes immediately
      - name: Invalidate CDN cache
        run: |
          gcloud compute backend-buckets update frontend-static-bucket --bypass-cache
