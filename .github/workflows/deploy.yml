name: Deploy React App to GCS

on:
  push:
    branches: [main]


env:
  VITE_API_URL: ${{ secrets.VITE_API_URL }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependency
        run: npm ci

      - name: Build React app with injected env
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }} 

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Sync build to GCS bucket
        run: |
          gsutil -m rsync -r -d dist/ gs://agentic-day-frontend/

      - name: Make files public
        run: |
          gsutil -m acl ch -r -u AllUsers:R gs://agentic-day-frontend/

      - name: Set cache control headers
        run: |
          gsutil -m setmeta -h "Cache-Control:public, max-age=31536000" gs://agentic-day-frontend/**/*.js
          gsutil -m setmeta -h "Cache-Control:public, max-age=31536000" gs://agentic-day-frontend/**/*.css
          gsutil -m setmeta -h "Cache-Control:public, max-age=3600" gs://agentic-day-frontend/index.html
